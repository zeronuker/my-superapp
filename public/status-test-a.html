<!DOCTYPE html>
<!-- TEMPORARY: iOS status-bar colour experiment. Delete status-test-* when done. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f4f6fb" />
<meta name="apple-mobile-web-app-title" content="Test A" />
<link rel="apple-touch-icon" sizes="180x180" href="/brand/icons/airborne/apple-touch-icon-180.png" />
<link rel="manifest" href="/status-test-a.webmanifest" />
<title>Status Test A</title>
<style>
  html, body { margin: 0; background: #f4f6fb; color: #0a1020; font-family: system-ui, sans-serif; }
  body { padding: 40px 24px; }
  /* same top strip as the real app, in its light colour */
  .ios-top-edge { display: none; }
  @media (display-mode: standalone) {
    .ios-top-edge { display: block; position: fixed; top: 0; left: 0; right: 0; height: 11px; background: #f4f6fb; pointer-events: none; z-index: 99999; }
  }
</style>
</head>
<body>
<div class="ios-top-edge" aria-hidden="true"></div>
<h1>Status Test A</h1>
<p>A — manifest LIGHT, meta LIGHT</p>
<p>Page background is light. Look at the status bar at the very top: light or dark?</p>
</body>
</html>
